<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:240px; flex-shrink:0; display:flex; flex-direction:column; border-right:1px solid #D9D7DE; background:#F3F2F6; height:100%; font-family:'Roboto',system-ui,sans-serif">
  <div style="height:64px; display:flex; align-items:center; gap:10px; padding:0 20px">
    <div style="width:32px; height:32px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:8px; background:#55659A; color:#FFFFFF; font-size:14px; font-weight:700">L</div>
    <span style="font-size:14px; font-weight:600; letter-spacing:0.04em; color:#2B2A30">Ledger</span>
  </div>
  <nav style="flex:1; padding:12px; display:flex; flex-direction:column; gap:4px">
    <sc-for list="{{ items }}" as="item" hint-placeholder-count="6">
      <span style="display:flex; align-items:center; gap:12px; height:44px; border-radius:999px; padding:0 16px; font-size:13px; background:{{ item.bg }}; color:{{ item.fg }}; font-weight:{{ item.weight }}"><i data-lucide="{{ item.icon }}"></i>{{ item.label }}</span>
    </sc-for>
  </nav>
  <div style="display:flex; flex-direction:column; gap:2px; border-top:1px solid #D9D7DE; padding:16px">
    <div style="display:flex; align-items:center; gap:10px; padding:8px">
      <div style="width:30px; height:30px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:999px; background:#E7E5EA; color:#55659A; font-size:11px; font-weight:700">SR</div>
      <div style="min-width:0">
        <p style="margin:0; font-size:12px; font-weight:600; color:#2B2A30; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">Senny Reyes</p>
        <p style="margin:0; font-size:11px; color:#6B6A72; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">senny@example.com</p>
      </div>
    </div>
    <span style="display:flex; align-items:center; gap:10px; border-radius:8px; padding:8px; font-size:12px; color:#6B6A72"><i data-lucide="log-out" style="width:14px;height:14px"></i>Sign out</span>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:720},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;Accounts&quot;,&quot;Activity&quot;,&quot;Budgets&quot;,&quot;Reports&quot;,&quot;Settings&quot;],&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const NAV = [
  { icon: 'house', label: 'Home' },
  { icon: 'wallet', label: 'Accounts' },
  { icon: 'arrow-left-right', label: 'Activity' },
  { icon: 'target', label: 'Budgets' },
  { icon: 'file-bar-chart-2', label: 'Reports' },
  { icon: 'settings', label: 'Settings' },
]
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Home'
    return {
      items: NAV.map((n) => ({
        ...n,
        bg: n.label === active ? '#E4E7F5' : 'transparent',
        fg: n.label === active ? '#2E3A63' : '#6B6A72',
        weight: n.label === active ? '600' : '500',
      })),
    }
  }
}
</script>
</body>
</html>
